<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="DriftPilot masks passwords and SNMP communities in a config diff before anything is sent to an AI model">
<style>
.t{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
.st{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
.h{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
.s{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
.c{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#e6edf3}
.x{fill:#ffa198;font-weight:700}
.m{fill:#f2cc60;font-weight:700}
</style>
<rect width="1000" height="330" rx="14" fill="#0d1117"/>
<text x="24" y="38" class="t">Same diff, two views</text>
<text x="976" y="38" class="st" text-anchor="end">driftpilot compare examples/cisco/before.cfg examples/cisco/after.cfg</text>
<rect x="24" y="64" width="440" height="242" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="42" y="88" class="h">Your diff</text>
<text x="446" y="88" class="s" text-anchor="end">stays on your machine</text>
<rect x="34" y="110" width="420" height="22" rx="3" fill="#3d1d20"/>
<text x="42" y="126" class="c" xml:space="preserve"><tspan fill="#ff7b72">- </tspan><tspan> neighbor 203.0.113.1 password </tspan><tspan class="x">Old-BGP-Key-2025</tspan></text>
<rect x="34" y="134" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="42" y="150" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> neighbor 203.0.113.1 password </tspan><tspan class="x">New-BGP-Key-2026</tspan></text>
<rect x="34" y="158" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="42" y="174" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> neighbor 198.51.100.1 remote-as 64501</tspan></text>
<rect x="34" y="182" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="42" y="198" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> neighbor 198.51.100.1 password </tspan><tspan class="x">ISP-B-Shared-Key</tspan></text>
<rect x="34" y="206" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="42" y="222" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> 25 permit tcp 192.0.2.0 0.0.0.255 any eq 22</tspan></text>
<rect x="34" y="230" width="420" height="22" rx="3" fill="#3d1d20"/>
<text x="42" y="246" class="c" xml:space="preserve"><tspan fill="#ff7b72">- </tspan><tspan>snmp-server community </tspan><tspan class="x">Example-RO-2025</tspan><tspan> RO</tspan></text>
<rect x="34" y="254" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="42" y="270" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan>snmp-server community </tspan><tspan class="x">Example-RO-2026</tspan><tspan> RO</tspan></text>
<g transform="translate(472,184)"><path d="M0 0 h40 m-12 -10 l12 10 l-12 10" fill="none" stroke="#f2cc60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="536" y="64" width="440" height="242" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="554" y="88" class="h">What the AI receives</text>
<text x="958" y="88" class="s" text-anchor="end">--llm-dry-run shows it first</text>
<rect x="546" y="110" width="420" height="22" rx="3" fill="#3d1d20"/>
<text x="554" y="126" class="c" xml:space="preserve"><tspan fill="#ff7b72">- </tspan><tspan> neighbor 203.0.113.1 password </tspan><tspan class="m">&lt;secret:1&gt;</tspan></text>
<rect x="546" y="134" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="554" y="150" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> neighbor 203.0.113.1 password </tspan><tspan class="m">&lt;secret:2&gt;</tspan></text>
<rect x="546" y="158" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="554" y="174" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> neighbor 198.51.100.1 remote-as 64501</tspan></text>
<rect x="546" y="182" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="554" y="198" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> neighbor 198.51.100.1 password </tspan><tspan class="m">&lt;secret:3&gt;</tspan></text>
<rect x="546" y="206" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="554" y="222" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan> 25 permit tcp 192.0.2.0 0.0.0.255 any eq 22</tspan></text>
<rect x="546" y="230" width="420" height="22" rx="3" fill="#3d1d20"/>
<text x="554" y="246" class="c" xml:space="preserve"><tspan fill="#ff7b72">- </tspan><tspan>snmp-server community </tspan><tspan class="m">&lt;secret:4&gt;</tspan><tspan> RO</tspan></text>
<rect x="546" y="254" width="420" height="22" rx="3" fill="#1b3326"/>
<text x="554" y="270" class="c" xml:space="preserve"><tspan fill="#7ee787">+ </tspan><tspan>snmp-server community </tspan><tspan class="m">&lt;secret:5&gt;</tspan><tspan> RO</tspan></text>
<text x="500.0" y="322" class="s" text-anchor="middle">Same value → same number, so the AI can still say "the BGP password changed" without ever seeing it.</text>
</svg>
