config system global
    set hostname "fw-branch-01"
    set admintimeout 30
end
config system interface
    edit "port1"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping https
    next
    edit "port2"
        set ip 192.0.2.254 255.255.255.0
        set allowaccess ping
    next
end
config user local
    edit "vpnuser1"
        set type password
        set passwd Example-Vpn-Pass-1
    next
end
config vpn ipsec phase1-interface
    edit "to-hq"
        set interface "port1"
        set remote-gw 198.51.100.20
        set psksecret Example-PSK-Old
    next
end
config firewall policy
    edit 1
        set name "lan-to-internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set nat enable
    next
end
