hostname edge-rtr-01
!
enable secret 9 $9$EXAMPLEonlyEXAMPLE$abcdefghijklmnopqrstuvwxyz0123456789ABCD
!
username netops privilege 15 secret 9 $9$EXAMPLEuser$0123456789abcdefghijklmnopqrstuvwxyzABCD
!
interface GigabitEthernet0/0/0
 description Uplink to ISP-A
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description Office LAN
 ip address 192.0.2.1 255.255.255.0
 ip access-group LAN-IN in
 no shutdown
!
router ospf 10
 router-id 192.0.2.1
 network 192.0.2.0 0.0.0.255 area 0
!
router bgp 64512
 neighbor 203.0.113.1 remote-as 64500
 neighbor 203.0.113.1 password Old-BGP-Key-2025
 neighbor 203.0.113.1 description ISP-A
!
ip access-list extended LAN-IN
 10 permit tcp 192.0.2.0 0.0.0.255 any eq 443
 20 permit udp 192.0.2.0 0.0.0.255 any eq 53
 30 deny ip any any log
!
snmp-server community Example-RO-2025 RO
tacacs server TAC1
 address ipv4 198.51.100.10
 key Example-Tacacs-Key
!
ntp server 198.51.100.123
!
end
