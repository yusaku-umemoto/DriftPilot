<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" blocking="render" src="js/theme.js"></script>
  <title>DriftPilot</title>
  <link rel="stylesheet" href="pilot.css">
  <script type="module" src="js/compare.js"></script>
</head>
<!--
  比較の画面（REQ-105。配置は REQ-206 / ADR-0148）。動きは wx の比較画面（gui/app.py）と同じ。
  上から ①上の3行（入力の2行と入れ替え・比較の設定の要約と「変更」と区間の選択）②帯 ③左右の面（左に結果、右に AI の面。境目はドラッグと矢印のキーで動く）
  ④操作 ⑤ステータス。メニューは作らず、ほかの窓を開く操作はボタンにする（一括の窓とログビューアーの窓は上の右の大きなボタン、「設定…」は下の段の右端。REQ-106・REQ-384）。
  文は書かず、data-text・data-placeholder・data-label（title と aria-label）の鍵で messages.py の文を取る。半角の括弧を含む文と選択肢は、Python が返す状態から描く。
  状態は Python（gui_web/compare_api.py）が返す JSON を js/compare.js が描く。窓の中身は縦にスクロールさせず、左右の面がそれぞれ1本だけスクロールする
-->
<body class="pilot-window">
  <main class="pilot-body">
    <!-- 上の3行（ADR-0148 決定1） -->
    <section class="pilot-group pilot-compare-top">
      <!-- 上の2行: 左に入力の2行と入れ替え、右に入口の大きなボタン2つ（ADR-0252 決定2 / REQ-384）。ボタンは入力の2行の高さに収める -->
      <div class="pilot-compare-head">
        <div class="pilot-input-swap">
          <div class="pilot-input-grid">
            <label for="before-name" data-text="compare.side.before"></label>
            <input id="before-name" class="pilot-input" type="text" readonly>
            <button type="button" class="pilot-button pilot-button--secondary" id="before-browse" data-text="compare.button.browse"></button>
            <button type="button" class="pilot-button pilot-button--secondary" id="before-paste" data-text="compare.button.paste"></button>
            <span id="before-summary"></span>
            <label for="after-name" data-text="compare.side.after"></label>
            <input id="after-name" class="pilot-input" type="text" readonly>
            <button type="button" class="pilot-button pilot-button--secondary" id="after-browse" data-text="compare.button.browse"></button>
            <button type="button" class="pilot-button pilot-button--secondary" id="after-paste" data-text="compare.button.paste"></button>
            <span id="after-summary"></span>
          </div>
          <!-- 変更前と変更後の入力と区間の選択を入れ替える（ADR-0078 決定2）。2行にまたがるアイコンのボタン。title と aria-label は data-label の文 -->
          <button type="button" class="pilot-button pilot-button--secondary pilot-swap" id="swap" data-text="compare.button.swap_icon" data-label="compare.button.swap"></button>
        </div>
        <!-- 入口のボタン（ADR-0252 決定2 / REQ-384）。中は縦に3段: アイコン・名前・短い説明。title と aria-label は名前と説明をつなげた文（data-label）。塗らない（青で塗る主ボタンと見分ける）。Mirarin の絵（hidden）はキャラクターがオンのときだけ出し、アイコンと説明の代わりに絵と名前の2段にする（ADR-0252 決定3 / REQ-385。出し分けは compare.js の renderCharacters） -->
        <div class="pilot-entry-group">
          <button type="button" class="pilot-button pilot-entry" id="open-batch" data-label="compare.button.batch.label">
            <svg class="pilot-entry-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 2h6l2 2h4a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2v-2h1V6h-4.8l-2-2H9v1H7V3a1 1 0 0 1 1-1zM3 8h6l2 2h7a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/></svg>
            <img src="character/entry-batch.png" alt="" aria-hidden="true" class="pilot-character pilot-entry-character" id="character-entry-batch" hidden>
            <span class="pilot-entry-name" data-text="compare.button.batch"></span>
            <span class="pilot-entry-note" data-text="compare.button.batch.note"></span>
          </button>
          <button type="button" class="pilot-button pilot-entry" id="open-log-view" data-label="compare.button.log_view.label">
            <svg class="pilot-entry-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 2h8l6 6v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V9h5.5zM8 12v2h8v-2zm0 4v2h8v-2z"/></svg>
            <img src="character/entry-log-viewer.png" alt="" aria-hidden="true" class="pilot-character pilot-entry-character" id="character-entry-log-view" hidden>
            <span class="pilot-entry-name" data-text="compare.button.log_view"></span>
            <span class="pilot-entry-note" data-text="compare.button.log_view.note"></span>
          </button>
        </div>
      </div>
      <!-- 3行目: 比較の設定の要約（Python が作る文）と「変更」。区間の選択は、どちらかの側に区間が複数あるときだけ出す -->
      <div class="pilot-row pilot-settings-line">
        <span class="pilot-note" data-text="compare.settings"></span>
        <span class="pilot-strong" id="settings-summary"></span>
        <button type="button" class="pilot-button pilot-button--secondary" id="settings-toggle" aria-expanded="false" aria-controls="settings-panel" data-text="compare.settings.change"></button>
        <span class="pilot-row pilot-segment-line" id="segment-line" hidden>
          <!-- 文は選択待ちのとき「区間の選択(選んでください)」（Python が返す） -->
          <span class="pilot-note" id="segment-title" data-text="compare.segments"></span>
          <label for="before-segment" data-text="compare.side.before"></label>
          <select id="before-segment" class="pilot-input"></select>
          <label for="after-segment" data-text="compare.side.after"></label>
          <select id="after-segment" class="pilot-input"></select>
        </span>
      </div>
      <!-- 今の比較の設定の欄。「変更」で開閉する。Python が欄へフォーカスを移すときは自動で開く -->
      <div class="pilot-row pilot-settings-panel" id="settings-panel" hidden>
        <fieldset class="pilot-radio-group" id="mode">
          <legend data-text="compare.mode"></legend>
        </fieldset>
        <label for="kind" data-text="compare.kind"></label>
        <select id="kind" class="pilot-input"></select>
        <!-- 機種の欄は種類で入れ替える。config ではパーサーの系統の選択、show・自動では名前の手入力 -->
        <label for="platform" id="platform-label" data-text="compare.platform"></label>
        <select id="config-platform" class="pilot-input pilot-grow"></select>
        <input id="platform" class="pilot-input pilot-grow" type="text" autocomplete="off" spellcheck="false" data-placeholder="compare.platform.hint">
        <label for="command" data-text="compare.command"></label>
        <input id="command" class="pilot-input pilot-grow" type="text" autocomplete="off" spellcheck="false" data-placeholder="compare.command.hint">
        <!-- 単純比較の設定（ADR-0166 / REQ-227 §11）。閉じた折りたたみ。見出しの横に今の設定の要約（Python が作る文）。
             欄の動きは js/raw_options.js（設定の窓と同じ部品・同じ id）。式の正しさは Python が確かめ、誤りの文を #rawopt-problems に出す -->
        <details class="pilot-details pilot-rawopt" id="raw-options">
          <summary><span data-text="raw_options.title"></span> <span class="pilot-note" id="raw-options-summary"></span></summary>
          <div class="pilot-details-body pilot-rawopt-body" id="rawopt-fields">
            <!-- 比較の窓の欄は「この窓だけ」の設定（REQ-361 §5）。設定の窓にはこの注記を置かない（settings.html は別の見出しと注記） -->
            <p class="pilot-note pilot-lines" data-text="raw_options.window_note"></p>
            <label for="rawopt-ignore" data-text="raw_options.ignore"></label>
            <textarea id="rawopt-ignore" class="pilot-input pilot-mono pilot-wide" rows="4" spellcheck="false"></textarea>
            <p class="pilot-note" data-text="raw_options.ignore.note"></p>
            <!-- 無効にした無視する行の式があるときだけ出す注記（REQ-359 §5）。文の雛形（{count} を数に直す）は #rawopt-ignore-disabled-template。
                 比較の窓と設定の窓で同じ id（雛形の文だけ窓ごとに違う） -->
            <p class="pilot-note" id="rawopt-ignore-disabled" hidden></p>
            <span id="rawopt-ignore-disabled-template" data-text="raw_options.ignore_disabled" hidden></span>
            <div class="pilot-row">
              <select id="rawopt-ignore-example" class="pilot-input" data-label="raw_options.example"><option value="" data-text="raw_options.example"></option></select>
            </div>
            <span class="pilot-rawopt-label" data-text="raw_options.replace"></span>
            <table class="pilot-table pilot-rawopt-replace" id="rawopt-replace">
              <thead>
                <tr>
                  <th scope="col" id="rawopt-replace-enabled-head" data-text="raw_options.replace.enabled"></th>
                  <th scope="col" id="rawopt-replace-pattern-head" data-text="raw_options.replace.pattern"></th>
                  <th scope="col" id="rawopt-replace-text-head" data-text="raw_options.replace.text"></th>
                  <th scope="col"><span id="rawopt-remove-label" data-text="raw_options.replace.remove" hidden></span></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
            <!-- 置き換えは show の表の比較の値にも当たる注記（ADR-0239 / REQ-358）。比較の窓と設定の窓で同じ id・同じ文のキー -->
            <p class="pilot-note" id="rawopt-replace-note" data-text="raw_options.replace.note"></p>
            <div class="pilot-row">
              <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-replace-add" data-text="raw_options.replace.add"></button>
              <select id="rawopt-replace-example" class="pilot-input" data-label="raw_options.example"><option value="" data-text="raw_options.example"></option></select>
            </div>
            <!-- 例から足そうとした式が既にあるとき、足さずに知らせる注記（ADR-0236 / REQ-353）。比較の窓と設定の窓で同じ id -->
            <p class="pilot-note" id="rawopt-duplicate" data-text="raw_options.duplicate" hidden></p>
            <!-- 「AI に式を頼む…」（ADR-0218 決定 8 / REQ-314）。押すと小さな窓（下の #rawopt-ai-dialog）。比較の窓と設定の窓で同じ id・同じ中身 -->
            <div class="pilot-row">
              <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai" data-text="raw_options.ai.button"></button>
            </div>
            <!-- 正規表現の書き方（ADR-0217 決定 6 / REQ-311）。閉じた折りたたみ（開いた状態は保存しない）。比較の窓と設定の窓で同じ id・同じ中身。
                 表の行は RAW_HELP_ROWS、箇条は RAW_HELP_NOTES の順（テストで確かめる）。文はすべて data-text -->
            <details class="pilot-details" id="rawopt-help">
              <summary data-text="raw_options.help"></summary>
              <div class="pilot-details-body">
                <table class="pilot-table" id="rawopt-help-table">
                  <thead><tr>
                    <th scope="col" data-text="raw_options.help.col.syntax"></th>
                    <th scope="col" data-text="raw_options.help.col.meaning"></th>
                    <th scope="col" data-text="raw_options.help.col.example"></th>
                  </tr></thead>
                  <tbody>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.dot.syntax"></td><td data-text="raw_options.help.row.dot.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.dot.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.classes.syntax"></td><td data-text="raw_options.help.row.classes.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.classes.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.boundary.syntax"></td><td data-text="raw_options.help.row.boundary.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.boundary.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.anchors.syntax"></td><td data-text="raw_options.help.row.anchors.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.anchors.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.repeat.syntax"></td><td data-text="raw_options.help.row.repeat.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.repeat.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.count.syntax"></td><td data-text="raw_options.help.row.count.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.count.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.set.syntax"></td><td data-text="raw_options.help.row.set.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.set.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.group.syntax"></td><td data-text="raw_options.help.row.group.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.group.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.either.syntax"></td><td data-text="raw_options.help.row.either.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.either.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.plain_group.syntax"></td><td data-text="raw_options.help.row.plain_group.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.plain_group.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.around.syntax"></td><td data-text="raw_options.help.row.around.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.around.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.escape.syntax"></td><td data-text="raw_options.help.row.escape.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.escape.example"></td></tr>
                    <tr><td class="pilot-mono" data-text="raw_options.help.row.ignore_case.syntax"></td><td data-text="raw_options.help.row.ignore_case.meaning"></td><td class="pilot-mono" data-text="raw_options.help.row.ignore_case.example"></td></tr>
                  </tbody>
                </table>
                <ul class="pilot-note-list" id="rawopt-help-notes">
                  <li data-text="raw_options.help.note.re"></li>
                  <li data-text="raw_options.help.note.replace"></li>
                  <li data-text="raw_options.help.note.compare_only"></li>
                  <li data-text="raw_options.help.note.same_line"></li>
                  <li data-text="raw_options.help.note.refused"></li>
                  <li data-text="raw_options.help.note.limits"></li>
                  <li data-text="raw_options.help.note.hides"></li>
                </ul>
              </div>
            </details>
            <div class="pilot-row">
              <label for="rawopt-space" data-text="raw_options.space"></label>
              <select id="rawopt-space" class="pilot-input">
                <option value="off" data-text="raw_options.space.off"></option>
                <option value="trailing" data-text="raw_options.space.trailing"></option>
                <option value="amount" data-text="raw_options.space.amount"></option>
                <option value="all" data-text="raw_options.space.all"></option>
              </select>
            </div>
            <p class="pilot-note" id="rawopt-space-note" data-text="raw_options.space.indent_note" hidden></p>
            <div class="pilot-row">
              <span class="pilot-radio">
                <input id="rawopt-blank" class="pilot-check" type="checkbox">
                <label for="rawopt-blank" data-text="raw_options.blank"></label>
              </span>
              <span class="pilot-radio">
                <input id="rawopt-case" class="pilot-check" type="checkbox">
                <label for="rawopt-case" data-text="raw_options.case"></label>
              </span>
            </div>
            <!-- REQ-228 §8.1: 差分のみ表示の前後の行数・行の移動・比べ方（範囲の確かめは Python。JavaScript は数を送るだけ） -->
            <div class="pilot-row">
              <label for="rawopt-context" data-text="raw_options.context"></label>
              <input id="rawopt-context" class="pilot-input pilot-rawopt-context" type="number" min="0" max="20" step="1">
            </div>
            <div class="pilot-row">
              <span class="pilot-radio">
                <input id="rawopt-moves" class="pilot-check" type="checkbox">
                <label for="rawopt-moves" data-text="raw_options.moves"></label>
              </span>
            </div>
            <p class="pilot-note" data-text="raw_options.moves.note"></p>
            <div class="pilot-row">
              <label for="rawopt-algorithm" data-text="raw_options.algorithm"></label>
              <select id="rawopt-algorithm" class="pilot-input">
                <option value="standard" data-text="raw_options.algorithm.standard"></option>
                <option value="minimal" data-text="raw_options.algorithm.minimal"></option>
                <option value="patience" data-text="raw_options.algorithm.patience"></option>
              </select>
            </div>
            <p class="pilot-note" data-text="raw_options.algorithm.note"></p>
            <p class="pilot-band pilot-band--error pilot-lines" id="rawopt-problems" role="alert" hidden></p>
            <div class="pilot-row">
              <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-reset" data-text="raw_options.reset"></button>
              <!-- この窓の欄の有効なルールのうち、既定のファイルに無いものを、既定のファイルの最後に足す（REQ-361 §5b。確認は dialog.js の confirm） -->
              <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-add-defaults" data-text="raw_options.add_defaults"></button>
            </div>
          </div>
          <!-- この窓だけの「比べない列」（REQ-367 §3）。単純比較の設定の欄（#rawopt-fields）の外に置く（欄の値・いつも効く設定には入れない）。
               構造化比較のタブの show の表の右クリックで足し、ここで 1 つずつ「外す」。「いつも効く設定に戻す」で空になる。
               一覧は view のトップレベルの skip_columns から textContent だけで描く。文は data-text（{column} は画面が列の名前に直す） -->
          <div class="pilot-details-body pilot-skip-columns" id="skip-columns">
            <span class="pilot-rawopt-label" data-text="compare.skip_columns.title"></span>
            <p class="pilot-note" data-text="compare.skip_columns.note"></p>
            <ul class="pilot-note-list" id="skip-columns-list"></ul>
            <span id="skip-columns-none" data-text="compare.skip_columns.none" hidden></span>
            <span id="skip-columns-remove" data-text="compare.skip_columns.remove" hidden></span>
            <span id="skip-columns-remove-template" data-text="compare.skip_columns.remove_label" hidden></span>
          </div>
        </details>
      </div>
    </section>

    <!-- 設定の窓で保存した設定を受けたとき・「いつも効く設定に足す」で足したときの帯（REQ-361 §3・§5b）。変更の欄（#settings-panel）が
         閉じていても見えるよう、欄の外に置く。文は Python が返し textContent で描く。ボタンは、この窓だけの設定を直接書いていて
         入れ替えなかったときだけ（押すと「いつも効く設定に戻す」と同じ） -->
    <div class="pilot-band pilot-band--info" id="raw-follow" role="status" hidden>
      <span class="pilot-lines pilot-grow" id="raw-follow-text"></span>
      <button type="button" class="pilot-button pilot-button--secondary" id="raw-follow-load" data-text="raw_follow.load" hidden></button>
    </div>
    <!-- 起動したときに見つけた新しい版の知らせ（REQ-252 §5 / ADR-0188 決定2）。文は Python が返す。
         「更新…」で設定の窓を「更新」のタブで開き、「閉じる」でその起動の間は出さない -->
    <div class="pilot-band pilot-band--info" id="update-notice" role="status" hidden>
      <span class="pilot-lines pilot-grow" id="update-notice-text"></span>
      <button type="button" class="pilot-button pilot-button--secondary" id="update-open" data-text="update_notice.open"></button>
      <button type="button" class="pilot-button pilot-button--secondary" id="update-dismiss" data-text="update_notice.dismiss"></button>
    </div>
    <!-- 自動送信がオンの間は常に出す（送り先の名前。ADR-0080 決定2）。文は Python が返す -->
    <div class="pilot-band pilot-band--info" id="auto-send" role="status" hidden><span class="pilot-lines" id="auto-send-text"></span></div>
    <!-- 保存した結果を開いて読むだけで表示している間の帯（REQ-120 / ADR-0083）。文と機密の注記は Python が返す。「閉じる」で表示を消す -->
    <div class="pilot-band pilot-band--info" id="opened" role="status" hidden>
      <div class="pilot-grow">
        <span class="pilot-lines" id="opened-text"></span>
        <p class="pilot-note" id="opened-note"></p>
      </div>
      <button type="button" class="pilot-button pilot-button--secondary" id="close-result" data-text="compare.button.close_result"></button>
    </div>
    <div class="pilot-band pilot-band--warning" id="banner" role="status" hidden><span class="pilot-lines" id="banner-text"></span></div>
    <!-- 複数の機器が入ったログの知らせ（REQ-267 / ADR-0194）。文と、押せるか・押せない理由は Python が返す（view.devices）。
         押せないときは disabled 属性を使わず aria-disabled と title（理由）で表す -->
    <div class="pilot-band pilot-band--info" id="devices" role="status" hidden>
      <span class="pilot-lines pilot-grow" id="devices-text"></span>
      <button type="button" class="pilot-button pilot-button--secondary" id="split-devices" data-text="compare.split_devices"></button>
    </div>

    <!-- 左右の面（ADR-0148 決定2）。左が結果、右が AI の面。初めの幅は 72:28、どちらも最小 220px。760px 未満は縦に積む。幅は利用者ごとの設定に覚える（REQ-370） -->
    <div class="pilot-fill pilot-split pilot-split--resizable" id="split">
    <!-- 結果の面。まとめて比べたとき（REQ-122）は左にコマンドの組の一覧を出し、選んだ組の結果を右のタブに出す。
         比較中は面の真ん中にスピナーと今の段階の文を重ねる（最後の #busy。REQ-205） -->
    <div class="pilot-fill pilot-split pilot-busy-host pilot-split-pane" id="result-pane">
      <section class="pilot-split-side" id="multi" hidden>
        <h2 class="pilot-group-title" data-text="compare.multi.title"></h2>
        <div class="pilot-table-wrap" id="multi-wrap" tabindex="0">
          <!-- 列は AI に送る（チェック。まとめて比べたときだけ。REQ-265）・コマンド（残りを埋める列）・状態・差分の数。
               列の幅は見出しの境目で変える（REQ-224 / ADR-0163）。先頭のチェックの列は 36px 固定で境目は付けない -->
          <table class="pilot-table pilot-table--fixed" id="multi-table">
            <colgroup>
              <col class="pilot-col-check">
              <col>
              <col class="pilot-col-multi-status">
              <col class="pilot-col-multi-diffs">
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="pilot-col-check" id="multi-send-col"><input type="checkbox" class="pilot-check" id="multi-send-all" data-label="compare.multi.send_all" data-title="compare.multi.col.send"><span class="pilot-ai-mark" data-text="compare.multi.send_mark" aria-hidden="true"></span></th>
                <th scope="col" data-text="compare.multi.col.command"></th>
                <th scope="col" data-text="compare.multi.col.status"></th>
                <th scope="col" data-text="compare.multi.col.diffs"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <!-- 比べる対象から外した区間（REQ-367 §4）。見出しは「外した区間 {n}」、中は名前と「戻す」。0 個なら隠す。
             中身は view.multi.excluded から textContent だけで描く。文は data-text（{n}・{name} は画面が直す） -->
        <details class="pilot-details" id="multi-excluded" hidden>
          <summary id="multi-excluded-title"></summary>
          <ul class="pilot-note-list" id="multi-excluded-list"></ul>
        </details>
        <span id="multi-excluded-title-template" data-text="compare.multi.excluded.title" hidden></span>
        <span id="multi-excluded-restore" data-text="compare.multi.excluded.restore" hidden></span>
        <span id="multi-excluded-restore-template" data-text="compare.multi.excluded.restore_label" hidden></span>
        <!-- 組の手での選び直し（REQ-269）。まとめて比べた結果のときだけ出す（開いた保存の結果と 1 つのログの中で組にしたときは隠す）。
             押せるかは Python が決める（選んだ行が相手なし・エラーの出力なら「相手を選ぶ…」、組なら「組を外す」） -->
        <div class="pilot-row pilot-multi-pairing" id="multi-pairing" hidden>
          <button type="button" class="pilot-button pilot-button--secondary" id="choose-partner" data-text="compare.multi.choose_partner"></button>
          <button type="button" class="pilot-button pilot-button--secondary" id="unpair" data-text="compare.multi.unpair"></button>
        </div>
      </section>
      <!-- コマンドの組の一覧と比較の表の境目（REQ-224 / ADR-0163）。まとめて比べたときだけ出す。左右の矢印のキーで 20px ずつ、
           ドラッグでも動く。一覧の幅は #multi の --pilot-split-width に入れる（保存しない）。名前は data-label の文 -->
      <div class="pilot-split-handle" id="multi-handle" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="multi" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" data-label="compare.multi.split.label" hidden></div>
      <div class="pilot-fill">
        <!-- タブの行。AI の面を別の窓で出している間だけ、右端に「↗」（別の窓を前に出す。ADR-0160 決定1）を出す。
             AI の欄を隠している間（別の窓で出していないとき）は、その隣に「« AI」（AI の欄を出す。ADR-0216 決定5）を出す。タブの並び（tablist）の外に置く -->
        <div class="pilot-tabs-bar">
          <div class="pilot-tabs" role="tablist">
            <!-- 「全コマンド比較結果」のタブ（ADR-0152 決定7・ADR-0193 決定5）。まとめて比べたときだけ出す（題は Python が「全コマンド比較結果 (N)」で渡す） -->
            <button type="button" class="pilot-tab" role="tab" id="tab-all" aria-controls="panel-all" aria-selected="false" data-text="compare.tab.all" hidden></button>
            <button type="button" class="pilot-tab" role="tab" id="tab-structured" aria-controls="panel-structured" aria-selected="true" data-text="compare.tab.structured"></button>
            <button type="button" class="pilot-tab" role="tab" id="tab-raw" aria-controls="panel-raw" aria-selected="false" data-text="compare.tab.raw"></button>
            <button type="button" class="pilot-tab" role="tab" id="tab-unparsed" aria-controls="panel-unparsed" aria-selected="false" data-text="compare.tab.unparsed"></button>
          </div>
          <button type="button" class="pilot-icon-button pilot-icon-button--text" id="ai-show" data-text="compare.ai.show_text" data-label="compare.ai.show" hidden></button>
          <button type="button" class="pilot-icon-button" id="ai-front" data-text="compare.ai.detach_icon" data-label="compare.ai.front" hidden></button>
        </div>
        <!-- 全部の組の差分（ADR-0152 決定7）。列はコマンド・操作・カテゴリ・対象・変更前・変更後。行は all_rows() で取る -->
        <div class="pilot-tabpanel pilot-fill" role="tabpanel" id="panel-all" aria-labelledby="tab-all" hidden>

            <table class="pilot-table pilot-table--fixed" id="all-table">

                <col class="pilot-col-target">
                <col class="pilot-col-op">
                <col class="pilot-col-category">
                <col class="pilot-col-target">

                <col class="pilot-col-value">
              </colgroup>
              <thead>
                <tr>
                  <th scope="col" data-text="compare.multi.col.command"></th>
                  <th scope="col" data-text="compare.col.op"></th>
                  <th scope="col" data-text="compare.col.category"></th>
                  <th scope="col" data-text="compare.col.target"></th>
                  <th scope="col" data-text="compare.col.before"></th>
                  <th scope="col" data-text="compare.col.after"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="pilot-tabpanel pilot-fill" role="tabpanel" id="panel-structured" aria-labelledby="tab-structured">
          <p class="pilot-lines" id="structured-warnings" hidden></p>
          <!-- 差分なしの絵（ADR-0174 決定2）。キャラクターがオンで、比べ終わって差分が 0 件のときだけ、文の上に出す。動く絵は 1 回だけ動く -->
          <img src="character/no-diff.png" alt="" aria-hidden="true" class="pilot-character pilot-character--motion" id="character-no-diff" hidden>
          <img src="character/no-diff-still.png" alt="" aria-hidden="true" class="pilot-character pilot-character--still" id="character-no-diff-still" hidden>
          <p class="pilot-note pilot-lines" id="structured-note"></p>
          <details class="pilot-details" id="structured-detail" hidden>
            <summary data-text="compare.details"></summary>
            <div class="pilot-details-body"><p class="pilot-lines" id="structured-detail-text"></p></div>
          </details>
          <!-- カテゴリのチップ（ADR-0155 決定1）。「すべて N」とカテゴリごとの「名前 件数」。文字は Python が作る。カテゴリが 1 種類以下なら隠す -->
          <div class="pilot-chips" id="structured-chips" role="group" data-label="compare.filter.title" hidden></div>
          <!-- 右クリックで隠している「同じ変更」の 1 行と「戻す」（REQ-389 / ADR-0255 決定3）。隠しているときだけ出す。文は Python が作り、textContent だけで入れる -->
          <div class="pilot-row pilot-same-row" id="structured-same" hidden>
            <p class="pilot-note" id="structured-same-text" role="status"></p>
            <button type="button" class="pilot-button pilot-button--secondary" id="structured-same-reset" data-text="compare.structured.same.reset"></button>
          </div>
          <!-- 列の絞り込みの 1 行と「すべて解除」（REQ-391 §5 / ADR-0256 決定5）。絞っているときだけ出す。同じ変更の 1 行の下に、別の行として並べる
               （2 つの文と 2 つのボタンを 1 行に入れると幅が足りないため）。文は Python が作り、textContent だけで入れる -->
          <div class="pilot-row pilot-same-row" id="structured-filter" hidden>
            <p class="pilot-note" id="structured-filter-text" role="status"></p>
            <button type="button" class="pilot-button pilot-button--secondary" id="structured-filter-clear" data-text="compare.column_filter.clear"></button>
          </div>
          <!-- 右クリックの「元の行を単純比較のタブで見る」「この列をこの窓だけ比べない」の知らせ（REQ-367 §2・§3）。最初は隠す。文は textContent だけで入れる -->
          <p class="pilot-note" id="structured-menu-note" role="status" hidden></p>
          <div class="pilot-table-wrap" id="structured-wrap" tabindex="0">
            <table class="pilot-table pilot-table--fixed" id="structured-table">
              <colgroup>
                <col class="pilot-col-op-mark">
                <col class="pilot-col-category">
                <col class="pilot-col-where">
                <col class="pilot-col-value-wide">
                <col class="pilot-col-value-wide">
              </colgroup>
              <thead>
                <!-- 見出しを押す・Enter・Space で、その列の並べ替え（昇順 → 降順 → 元の順。画面の中だけ。REQ-369）。
                     列の境目（.pilot-col-resize）の上では並べ替えない。ボタンを入れ子にせず th 自体を押せるようにして、
                     見出しのセルの意味と aria-sort をそのまま保つ -->
                <tr>
                  <!-- 見出しの右の ▼ は列の絞り込み（REQ-391）。押すと値の一覧の窓（#column-filter）。並べ替えにはならない。
                       見出しの文は span に入れる（ボタンを消さないように）。ボタンの読み上げの名前（aria-label）は js/compare.js が入れる -->
                  <th scope="col" aria-sort="none" tabindex="0"><span data-text="compare.col.op"></span><button type="button" class="pilot-filter-button" data-filter-table="structured" data-filter-column="op" aria-haspopup="dialog" aria-pressed="false"></button></th>
                  <th scope="col" aria-sort="none" tabindex="0"><span data-text="compare.col.category"></span><button type="button" class="pilot-filter-button" data-filter-table="structured" data-filter-column="category" aria-haspopup="dialog" aria-pressed="false"></button></th>
                  <th scope="col" aria-sort="none" tabindex="0"><span data-text="compare.col.target_item"></span><button type="button" class="pilot-filter-button" data-filter-table="structured" data-filter-column="target_item" aria-haspopup="dialog" aria-pressed="false"></button></th>
                  <th scope="col" aria-sort="none" tabindex="0"><span data-text="compare.col.before"></span><button type="button" class="pilot-filter-button" data-filter-table="structured" data-filter-column="before" aria-haspopup="dialog" aria-pressed="false"></button></th>
                  <th scope="col" aria-sort="none" tabindex="0"><span data-text="compare.col.after"></span><button type="button" class="pilot-filter-button" data-filter-table="structured" data-filter-column="after" aria-haspopup="dialog" aria-pressed="false"></button></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="pilot-tabpanel pilot-fill" role="tabpanel" id="panel-raw" aria-labelledby="tab-raw" hidden>
          <!-- 差分なしの絵（ADR-0174 決定2）。単純比較だけのときは、このタブの文が「差分なし」を出すので、ここにも置く -->
          <img src="character/no-diff.png" alt="" aria-hidden="true" class="pilot-character pilot-character--motion" id="character-no-diff-raw" hidden>
          <img src="character/no-diff-still.png" alt="" aria-hidden="true" class="pilot-character pilot-character--still" id="character-no-diff-raw-still" hidden>
          <div class="pilot-row">
            <p class="pilot-note pilot-lines pilot-grow" id="raw-note"></p>
            <!-- 単純比較の設定で無視した行・同じとみなした行の数（ADR-0166 決定11-2）。押すと表をその行だけにする。もう一度押すと戻す。
                 文は Python が返す（無ければ隠す）。「差分のみ表示」とはどちらか 1 つ -->
            <button type="button" class="pilot-chip" id="raw-set-aside" aria-pressed="false" hidden></button>
            <!-- 差分のみ表示（ADR-0155 決定2〜5）。差分の行と前後 3 行だけを残し、間を 1 行に折りたたむ。既定はオフ。差分が無いときは押せない -->
            <span class="pilot-radio">
              <input id="raw-diff-only" class="pilot-check" type="checkbox">
              <label for="raw-diff-only" data-text="compare.raw.diff_only"></label>
            </span>
            <button type="button" class="pilot-button pilot-button--secondary" id="prev-diff" data-text="compare.button.prev"></button>
            <button type="button" class="pilot-button pilot-button--secondary" id="next-diff" data-text="compare.button.next"></button>
          </div>
          <!-- 印の列の絞り込みの 1 行と「すべて解除」（REQ-391 §5）。絞っているときだけ出す。文は Python が作り、textContent だけで入れる -->
          <div class="pilot-row pilot-same-row" id="raw-filter" hidden>
            <p class="pilot-note" id="raw-filter-text" role="status"></p>
            <button type="button" class="pilot-button pilot-button--secondary" id="raw-filter-clear" data-text="compare.column_filter.clear"></button>
          </div>
          <!-- 右クリックから足したルールが、同じで足せなかった・欄が満ちていて足せなかったときの知らせ（REQ-366 §2〜§4）。
               比較の設定の欄が閉じていても分かるよう、ここに出す。文は js/compare.js が #rawopt-duplicate・#rawopt-ai-full の文を写す -->
          <p class="pilot-note" id="raw-rule-note" role="status" hidden></p>
          <!-- 効いているルール（REQ-359 / ADR-0240 決定 2）。閉じた折りたたみ。見出しと行は Python が返す（ルールが無ければ隠す）。
               チェックを切り替えると、単純比較の設定の欄（#rawopt-fields）の無効が切り替わる（js/compare.js → js/raw_options.js）。
               文字は textContent で入れる。表の部品は今の .pilot-table と同じ -->
          <details class="pilot-details" id="raw-rules" hidden>
            <summary id="raw-rules-title"></summary>
            <div class="pilot-details-body">
              <p class="pilot-note" data-text="raw_options.rules.note"></p>
              <div class="pilot-table-wrap" tabindex="0">
                <table class="pilot-table" id="raw-rules-table">
                  <thead>
                    <tr>
                      <th scope="col" data-text="raw_options.rules.col.enabled"></th>
                      <th scope="col" data-text="raw_options.rules.col.kind"></th>
                      <th scope="col" data-text="raw_options.rules.col.pattern"></th>
                      <th scope="col" data-text="raw_options.rules.col.replacement"></th>
                      <th scope="col" data-text="raw_options.rules.col.hits"></th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </details>
          <div class="pilot-table-wrap" id="raw-wrap" tabindex="0">
            <table class="pilot-table pilot-table--fixed pilot-mono" id="raw-table">
              <colgroup>
                <col class="pilot-col-mark">
                <col class="pilot-col-no">
                <col class="pilot-col-text">
                <col class="pilot-col-no">
                <col class="pilot-col-text">
              </colgroup>
              <thead>
                <tr>
                  <!-- 印の列の見出し。文字は無く、右の ▼ が印の列の絞り込み（REQ-391）。読み上げの名前は js/compare.js が入れる -->
                  <th scope="col"><button type="button" class="pilot-filter-button" data-filter-table="raw" data-filter-column="mark" aria-haspopup="dialog" aria-pressed="false"></button></th>
                  <th scope="col" data-text="compare.col.before_no"></th>
                  <th scope="col" data-text="compare.col.before"></th>
                  <th scope="col" data-text="compare.col.after_no"></th>
                  <th scope="col" data-text="compare.col.after"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <!-- 選んだ行の変更前と変更後の全文（読むだけ。文字を選んでコピーできる）。違う文字の印（<mark>）を描けるように、
               textarea ではなく読むだけの文字の箱にする（REQ-226 §4.3）。中身は marks.js の paintMarks が文字として描く。名前は data-label の文 -->
          <div class="pilot-pair">
            <div id="raw-before" class="pilot-line-view pilot-mono" role="textbox" aria-readonly="true" aria-multiline="true" tabindex="0" data-label="compare.col.before"></div>
            <div id="raw-after" class="pilot-line-view pilot-mono" role="textbox" aria-readonly="true" aria-multiline="true" tabindex="0" data-label="compare.col.after"></div>
          </div>
        </div>
        <div class="pilot-tabpanel pilot-fill" role="tabpanel" id="panel-unparsed" aria-labelledby="tab-unparsed" hidden>
          <p class="pilot-note pilot-lines" id="unparsed-note"></p>
          <div class="pilot-table-wrap" tabindex="0">
            <table class="pilot-table pilot-table--fixed pilot-mono" id="unparsed-table">
              <colgroup>
                <col class="pilot-col-op">
                <col class="pilot-col-line">
                <col class="pilot-col-parents">
              </colgroup>
              <thead>
                <tr>
                  <th scope="col" data-text="compare.col.op"></th>
                  <th scope="col" data-text="compare.col.line"></th>
                  <th scope="col" data-text="compare.col.parents"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <!-- 空の窓の絵（ADR-0174 決定2）。キャラクターがオンで、この窓でまだ一度も比べていないとき、結果の面の真ん中に重ねる。
           クリックは受けない（下の面はそのまま操作できる） -->
      <img src="character/welcome.png" alt="" aria-hidden="true" class="pilot-character" id="character-welcome" hidden>
      <!-- 比較中の表示（REQ-205 / ADR-0147 決定3）。view.busy の間だけ出す。クリックは受けない（「中止」は押せる）。
           文はステータスの行と同じなので、二重に読み上げないよう aria-hidden にする -->
      <div class="pilot-busy" id="busy" aria-hidden="true" hidden><span class="pilot-spinner"></span><span class="pilot-busy-text pilot-lines" id="busy-text"></span></div>
    </div>

    <!-- 境目。左右の矢印のキーで 20px ずつ、ドラッグ（pointer の事象）でも動く。名前は data-label の文 -->
    <div class="pilot-split-handle" id="split-handle" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="result-pane" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" data-label="compare.split.label"></div>

    <!-- AI の面（ADR-0148 決定4・5・8）。いつも出す。上から見出し、答えと質問の吹き出し（スクロールは1本）、質問の欄、切り替えとボタン -->
    <section class="pilot-split-pane pilot-ai-pane" id="ai-pane" aria-labelledby="ai-title">
      <!-- 見出しの右端の「↗」で AI の面を別の窓で開く（ADR-0160 決定1）。その左の「»」で AI の欄を隠す（ADR-0216 決定5。比較の窓だけ）。
           title と aria-label は data-label の文 -->
      <div class="pilot-ai-head">
        <h2 class="pilot-group-title" id="ai-title" data-text="compare.llm"></h2>
        <button type="button" class="pilot-icon-button" id="ai-hide" data-text="compare.ai.hide_icon" data-label="compare.ai.hide"></button>
        <button type="button" class="pilot-icon-button" id="ai-detach" data-text="compare.ai.detach_icon" data-label="compare.ai.detach"></button>
      </div>
      <!-- 「考えている内容」の折りたたみ（ADR-0169 決定4）の題と注記。js/ai_view.js が読んで、JS が作る details に textContent で入れる -->
      <span id="ai-thinking-title" data-text="compare.ai.thinking.title" hidden></span>
      <span id="ai-thinking-note" data-text="compare.ai.thinking.note" hidden></span>
      <!-- キャラクターがオンのときの空の面の案内（ADR-0181 決定2）。js/ai_view.js が読んで #ai-empty に入れる -->
      <span id="ai-empty-character" data-text="compare.ai.empty.character" hidden></span>
      <span id="ai-empty-plain" data-text="compare.ai.empty" hidden></span>
      <div class="pilot-chat" id="ai-chat" tabindex="0">
        <!-- 答えが無いときの短い案内 -->
        <p class="pilot-note" id="ai-empty" data-text="compare.ai.empty"></p>
        <!-- 最初の依頼（右の吹き出し。ADR-0179 決定1）。追加の質問の吹き出しと同じ形。文は Python が view の follow_up.first_request で渡し、
             js/ai_view.js が textContent だけで入れる（無ければ hidden） -->
        <div class="pilot-bubble pilot-bubble--me" id="first-request" data-label="compare.ai.first_request" hidden>
          <p class="pilot-lines" id="first-request-text"></p>
        </div>
        <!-- 最初の答え（左の吹き出し。REQ-204）。読むだけで、文字は選んでコピーできる。Python が読み取ったブロックを js/answer_view.js が
             textContent だけで描く。コピーのアイコンは答えがあるときだけ出す -->
        <!-- 答えの吹き出しの上の顔と名前（ADR-0181 決定1）。キャラクターがオンで吹き出しが出ているときだけ js/ai_view.js が hidden を外す。
             名前と title は data-text・data-title の鍵の文。追加の質問の回答と途中の答えには、js/ai_view.js が同じ形の行を作って足す -->
        <div class="pilot-avatar-row" id="llm-avatar" hidden>
          <img src="character/avatar.png" alt="" aria-hidden="true" class="pilot-avatar" data-title="character.avatar.title">
          <span class="pilot-avatar-name" data-text="character.name"></span>
        </div>
        <div class="pilot-bubble pilot-bubble--ai" id="llm-bubble" hidden>
          <div id="llm-view" class="pilot-answer" tabindex="0"></div>
          <button type="button" class="pilot-icon-button" id="llm-copy" data-label="compare.button.copy" hidden></button>
        </div>
        <!-- 追加の質問のやり取り（ADR-0081）。質問は右、答えは左の吹き出しで順に並べる。押せるかは Python が決める -->
        <div class="pilot-chat-turns" id="follow-up-turns"></div>
        <p class="pilot-note" id="follow-up-note" hidden></p>
        <!-- API が返したエラーの文（ADR-0168 決定5）。既定は閉じる。題・文・注記は Python が view の api_error で渡し、textContent だけで入れる。
             キャラクターがオンのときだけ、文の左に警告の絵を出す（ADR-0174 決定2。#api-error-row はオフのときは形を持たない） -->
        <div id="api-error-row">
          <img src="character/warning.png" alt="" aria-hidden="true" class="pilot-character" id="character-warning" hidden>
          <details class="pilot-details" id="api-error" hidden>
            <summary id="api-error-title"></summary>
            <p class="pilot-lines pilot-mono" id="api-error-text"></p>
            <p class="pilot-note pilot-lines" id="api-error-note"></p>
          </details>
        </div>
        <!-- AI に送る間のクルクルと今の状態の文（ADR-0164 決定5）。途中の答えが出たら隠す。文はステータスの行と同じなので読み上げは重ねない。
             キャラクターがオンのときは、スピナーの代わりに考え中の絵を出す（ADR-0174 決定2） -->
        <div class="pilot-ai-busy" id="ai-busy" aria-hidden="true" hidden><span class="pilot-spinner pilot-spinner--small" id="ai-busy-spinner"></span><img src="character/ai-thinking.png" alt="" aria-hidden="true" class="pilot-character pilot-character--motion" id="character-ai-thinking" hidden><img src="character/ai-thinking-still.png" alt="" aria-hidden="true" class="pilot-character pilot-character--still" id="character-ai-thinking-still" hidden><span class="pilot-lines" id="ai-busy-text"></span></div>
      </div>
      <div class="pilot-ai-controls">
        <!-- 入力欄の横のマイクのボタン（ADR-0233 / REQ-341）。音声入力が使えないときは出さない（hidden）。状態・押せるか・文は Python が決める。
             録音中は音量の棒と経過の秒を出す。文字は入力欄のカーソルの位置に入れるだけで、送らない -->
        <!-- 入力欄の枠（REQ-364）。右下にマイクのボタンと送信のボタン（#follow-up-send）を並べる。送信のボタンは Shift+Enter と同じ送り方を呼ぶだけ -->
        <div class="pilot-chat-input">
          <textarea id="follow-up-question" class="pilot-input pilot-wide" rows="2" spellcheck="false" data-label="compare.ai.input" data-placeholder="compare.ai.input.hint"></textarea>
          <div class="pilot-chat-input-buttons">
            <button type="button" class="pilot-icon-button pilot-voice-button" id="voice-button" data-label="voice.button" aria-pressed="false" hidden disabled>
              <svg class="pilot-voice-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
            </button>
            <button type="button" class="pilot-icon-button pilot-chat-send" id="follow-up-send" data-label="compare.ai.send" disabled>
              <svg class="pilot-chat-send-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 4l7 8h-4.5v8h-5v-8H5z"/></svg>
            </button>
          </div>
        </div>
        <div class="pilot-voice-status" id="voice-status" hidden>
          <span class="pilot-voice-level" aria-hidden="true"><span class="pilot-voice-level-bar" id="voice-level-bar"></span></span>
          <span id="voice-elapsed" aria-hidden="true"></span>
        </div>
        <p class="pilot-note pilot-lines" id="voice-note" role="status" hidden></p>
        <p class="pilot-note" id="voice-limit-note" role="status" hidden></p>
        <!-- LLM の直し（REQ-342）。入力欄の近くの小さなボタン。最初は隠す。「直す前に戻す」は置き換えた後、「LLM の直しを使う」は
             直している間に欄を書き換えたときに出す。次の録音・送信・自分以外の入力で消す -->
        <div class="pilot-voice-correct">
          <button type="button" class="pilot-button pilot-button--secondary" id="voice-revert" data-text="voice.revert" hidden></button>
          <button type="button" class="pilot-button pilot-button--secondary" id="voice-use-correction" data-text="voice.use_correction" hidden></button>
        </div>
        <!-- 「差分＋全文を送る」（ADR-0158 決定1・9・10）。既定はオフ。押せるか・オンの間の案内は Python が決める -->
        <!-- 押せない理由・全文を付ける組（ADR-0175 決定1・2）はすぐ下の注記と title に出す。文は Python が決める -->
        <span class="pilot-radio">
          <input id="send-full-text" class="pilot-check" type="checkbox">
          <label for="send-full-text" data-text="compare.llm.full_text"></label>
        </span>
        <p class="pilot-note pilot-lines" id="send-full-text-reason" hidden></p>
        <p class="pilot-note pilot-lines" id="send-full-text-note" hidden></p>
        <div class="pilot-row pilot-ai-row">
          <label for="ai-profile" data-text="compare.ai.profile"></label>
          <select id="ai-profile" class="pilot-input"></select>
          <label for="prompt-profile" data-text="compare.ai.prompt"></label>
          <select id="prompt-profile" class="pilot-input"></select>
          <!-- 1つのボタン（ADR-0148 決定5）。名前と押せるかは Python が渡す材料で決まる -->
          <button type="button" class="pilot-button pilot-button--secondary pilot-ai-ask" id="ai-ask"></button>
        </div>
        <!-- まとめて比べたとき、AI に送る組の数と、1 つもチェックしていないときの押せない理由（REQ-265）。Python が渡す文を出すだけ -->
        <p class="pilot-note pilot-lines" id="ai-send-pairs" hidden></p>
        <p class="pilot-note pilot-lines" id="ai-send-reason" hidden></p>
        <!-- 今の質問の対象と、表示が前の答えと違うときの注意（REQ-312）。Python が渡す文を textContent で出すだけ -->
        <p class="pilot-note pilot-lines" id="ai-target" hidden></p>
        <p class="pilot-note pilot-lines" id="ai-target-note" hidden></p>
        <p class="pilot-note pilot-lines" id="ai-note" hidden></p>
      </div>
    </section>
    </div>
  </main>

  <!-- 下のボタン（ADR-0148 決定3）: 比較・中止、間、保存・開く・出力（ADR-0156）、右端に設定の窓 -->
  <footer class="pilot-footer">
    <button type="button" class="pilot-button pilot-button--primary" id="run" data-text="compare.button.run"></button>
    <button type="button" class="pilot-button pilot-button--secondary" id="cancel" data-text="compare.button.cancel"></button>
    <!-- 選んだファイル・比較の結果・AI の会話を消して、起動したときの画面に戻す（ADR-0254 / REQ-388）。押せるか・理由・確かめが要るかは Python が決める -->
    <button type="button" class="pilot-button pilot-button--secondary" id="clear" data-text="compare.button.clear"></button>
    <span class="pilot-footer-gap"></span>
    <button type="button" class="pilot-button pilot-button--secondary" id="save" data-text="compare.button.save"></button>
    <!-- 保存した結果を読むだけで開く（REQ-120）。ファイルは Python が窓のダイアログで選ぶ -->
    <button type="button" class="pilot-button pilot-button--secondary" id="open-result" data-text="compare.button.open_result"></button>
    <!-- 人に渡す形の出力（ADR-0156）。形は選ぶダイアログで、秘密の行は既定で伏せる（ダイアログのチェックで選ぶ。ADR-0257） -->
    <button type="button" class="pilot-button pilot-button--secondary" id="export" data-text="compare.button.export"></button>
    <span class="pilot-note pilot-grow" id="save-note"></span>
    <!-- 一括の窓とログビューアーの窓を開くボタンは、上の右へ移した（ADR-0252 決定2 / REQ-384） -->
    <button type="button" class="pilot-button pilot-button--secondary" id="open-settings" data-text="compare.button.settings"></button>
  </footer>
  <div class="pilot-statusbar pilot-statusbar--split" role="status">
    <span class="pilot-status-main" id="status-main"></span>
    <!-- 使っている単純比較の設定の要約（ADR-0166 決定11-1）。既定なら隠す。はみ出す分は「…」で、全文は title -->
    <span class="pilot-status-note" id="raw-settings-line" hidden></span>
    <span class="pilot-status-side" id="status-side"></span>
  </div>
  <!-- 単純比較のタブの右クリックしたときの、窓の中の小さなメニュー（REQ-360 / ADR-0240 決定 3、REQ-366 / ADR-0244 決定 1・2）。
       項目は 6 つ。どれも最初は隠し、右クリックした場所（選んだ文字・行）で出すものだけ見せる。動きは js/compare.js。
       説明の決まった文は隠した要素に持つ（HTML に文は書かない。文は data-text） -->
  <div class="pilot-menu" id="raw-menu" role="menu" data-label="compare.raw.menu.ai" hidden>
    <button type="button" class="pilot-menu-item" role="menuitem" id="raw-menu-ai" data-text="compare.raw.menu.ai" hidden></button>
    <button type="button" class="pilot-menu-item" role="menuitem" id="raw-menu-replace" data-text="compare.raw.menu.replace" hidden></button>
    <button type="button" class="pilot-menu-item" role="menuitem" id="raw-menu-digits" data-text="compare.raw.menu.digits" hidden></button>
    <button type="button" class="pilot-menu-item" role="menuitem" id="raw-menu-ignore" data-text="compare.raw.menu.ignore" hidden></button>
    <button type="button" class="pilot-menu-item" role="menuitem" id="raw-menu-rules" data-text="compare.raw.menu.rules" hidden></button>
    <button type="button" class="pilot-menu-item" role="menuitem" id="raw-menu-ask" data-text="compare.raw.menu.ask" hidden></button>
  </div>
  <span id="raw-menu-description" data-text="compare.raw.menu.description" hidden></span>
  <!-- 列の絞り込みの値の一覧の小さな窓（REQ-391 §3 / ADR-0256 決定2）。1 つを 2 つの表の見出しのボタンで使い回す。
       検索の欄・すべて選択・値ごとのチェック（値と件数）・OK・キャンセル。値の文字は textContent だけで入れる（js/column_filter.js）。
       Esc・外を押す・スクロール・タブの切り替えで閉じる（キャンセルと同じ）。読み上げの名前（aria-label）は列ごとに js/column_filter.js が入れる -->
  <div class="pilot-column-filter" id="column-filter" role="dialog" hidden>
    <input id="column-filter-search" class="pilot-input" type="search" autocomplete="off" spellcheck="false" data-placeholder="compare.column_filter.search" data-label="compare.column_filter.search">
    <span class="pilot-radio">
      <input id="column-filter-all" class="pilot-check" type="checkbox">
      <label for="column-filter-all" data-text="compare.column_filter.select_all"></label>
    </span>
    <div class="pilot-column-filter-list" id="column-filter-list" role="group"></div>
    <p class="pilot-note" id="column-filter-over" role="status" hidden></p>
    <div class="pilot-row pilot-column-filter-buttons">
      <button type="button" class="pilot-button" id="column-filter-ok" data-text="compare.column_filter.ok"></button>
      <button type="button" class="pilot-button pilot-button--secondary" id="column-filter-cancel" data-text="compare.column_filter.cancel"></button>
    </div>
  </div>
  <!-- 構造化比較のタブの行の右クリックしたときのメニュー（REQ-367 §2・§3）。項目は「元の行を単純比較のタブで見る」と、
       show の表の変更の行で変わった列ごとの「この列をこの窓だけ比べない: 列」（列の項目は #structured-menu-columns に textContent だけで作る）。
       どれも最初は隠し、右クリックした行で出すものだけ見せる。動きは js/compare.js -->
  <div class="pilot-menu" id="structured-menu" role="menu" data-label="compare.structured.menu.source" hidden>
    <button type="button" class="pilot-menu-item" role="menuitem" id="structured-menu-source" data-text="compare.structured.menu.source" hidden></button>
    <button type="button" class="pilot-menu-item" role="menuitem" id="structured-menu-hide-same" hidden></button>
    <button type="button" class="pilot-menu-item" role="menuitem" id="structured-menu-only-same" hidden></button>
    <div id="structured-menu-columns"></div>
  </div>
  <!-- 「同じ変更を隠す（N 件）」「同じ変更だけ表示（N 件）」の文のひな形（REQ-389。{count} を行の数に直す） -->
  <span id="structured-menu-hide-same-template" data-text="compare.structured.menu.hide_same" hidden></span>
  <span id="structured-menu-only-same-template" data-text="compare.structured.menu.only_same" hidden></span>
  <span id="structured-menu-skip-template" data-text="compare.structured.menu.skip_column" hidden></span>
  <span id="structured-menu-not-found" data-text="compare.structured.menu.not_found" hidden></span>
  <span id="structured-menu-skip-duplicate" data-text="compare.structured.menu.skip_duplicate" hidden></span>
  <span id="structured-menu-skip-full" data-text="compare.structured.menu.skip_full" hidden></span>
  <!-- コマンドの組の一覧の行の右クリックしたときのメニュー（REQ-367 §4）。項目は「この区間を比べる対象から外す」の 1 つ -->
  <div class="pilot-menu" id="multi-menu" role="menu" data-label="compare.multi.menu.exclude" hidden>
    <button type="button" class="pilot-menu-item" role="menuitem" id="multi-menu-exclude" data-text="compare.multi.menu.exclude"></button>
  </div>
  <!-- 「この行に効いているルールを見る」の小さな窓（REQ-366 §5）。見出しと本文は textContent だけで入れる。
       本文は側（変更前・変更後）ごとに、当たったルールの種類・式・置き換える文字。Esc か「閉じる」で閉じ、フォーカスを表に戻す -->
  <dialog id="raw-line-rules" class="pilot-dialog" aria-labelledby="raw-line-rules-title">
    <h2 class="pilot-dialog-title" id="raw-line-rules-title" data-text="compare.raw.line_rules.title"></h2>
    <div class="pilot-dialog-body" id="raw-line-rules-body"></div>
    <div class="pilot-dialog-buttons">
      <button type="button" class="pilot-button pilot-button--secondary" id="raw-line-rules-close" data-text="raw_options.ai.close"></button>
    </div>
  </dialog>
  <!-- 「AI に式を頼む…」の小さな窓（ADR-0218 決定 8 / REQ-314）。比較の窓と設定の窓で同じ id・同じ中身。動きは js/raw_options.js。
       欄（#rawopt-fields）の外に置く（中で打った文字の change を欄の外側に届かせないため）。段は 4 つ（入力・確認・待つ間・結果）で、
       文はすべて data-text か Python が返した文（textContent）。式・置き換える文字・説明・貼った行も textContent だけで入れる -->
  <dialog id="rawopt-ai-dialog" class="pilot-dialog pilot-dialog--wide" aria-labelledby="rawopt-ai-title">
    <h2 class="pilot-dialog-title" id="rawopt-ai-title" data-text="raw_options.ai.title"></h2>
    <div class="pilot-rawopt-ai-stage" id="rawopt-ai-input">
      <div class="pilot-dialog-body">
        <label for="rawopt-ai-lines" data-text="raw_options.ai.lines"></label>
        <textarea id="rawopt-ai-lines" class="pilot-input pilot-mono pilot-wide" rows="8" spellcheck="false"></textarea>
        <label for="rawopt-ai-description" data-text="raw_options.ai.description"></label>
        <input id="rawopt-ai-description" class="pilot-input pilot-wide" type="text" autocomplete="off" spellcheck="false" aria-describedby="rawopt-ai-description-hint">
        <p class="pilot-note" id="rawopt-ai-description-hint" data-text="raw_options.ai.description.hint"></p>
        <!-- 右クリックから開いたときだけ出す、選んだ文字（REQ-360）。ボタンから開いたときと窓を閉じたときは隠す。中身は textContent -->
        <p class="pilot-note pilot-lines" id="rawopt-ai-selection" hidden><span data-text="raw_options.ai.selection"></span> <code class="pilot-mono" id="rawopt-ai-selection-text"></code></p>
        <fieldset class="pilot-radio-group">
          <legend data-text="raw_options.ai.kind"></legend>
          <label class="pilot-radio"><input class="pilot-check" type="radio" name="rawopt-ai-kind" id="rawopt-ai-kind-replace" value="replace" checked><span data-text="raw_options.ai.kind.replace"></span></label>
          <label class="pilot-radio"><input class="pilot-check" type="radio" name="rawopt-ai-kind" id="rawopt-ai-kind-ignore" value="ignore"><span data-text="raw_options.ai.kind.ignore"></span></label>
        </fieldset>
        <p class="pilot-note" id="rawopt-ai-full" data-text="raw_options.ai.full" hidden></p>
        <p class="pilot-band pilot-band--error pilot-lines" id="rawopt-ai-refused" role="alert" hidden></p>
      </div>
      <div class="pilot-dialog-buttons">
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-check" data-text="raw_options.ai.check"></button>
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-input-close" data-text="raw_options.ai.close"></button>
      </div>
    </div>
    <div class="pilot-rawopt-ai-stage" id="rawopt-ai-confirm" hidden>
      <div class="pilot-dialog-body">
        <span class="pilot-rawopt-label" id="rawopt-ai-prompt-title"></span>
        <textarea id="rawopt-ai-prompt" class="pilot-input pilot-mono pilot-wide" readonly spellcheck="false" aria-labelledby="rawopt-ai-prompt-title"></textarea>
        <p class="pilot-note" id="rawopt-ai-destination"></p>
        <p class="pilot-note" id="rawopt-ai-omitted"></p>
        <p class="pilot-note" id="rawopt-ai-note"></p>
      </div>
      <div class="pilot-dialog-buttons">
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-send"></button>
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-dont-send"></button>
      </div>
    </div>
    <div class="pilot-rawopt-ai-stage" id="rawopt-ai-waiting" hidden>
      <div class="pilot-dialog-body">
        <p class="pilot-note" id="rawopt-ai-asking" role="status" data-text="raw_options.ai.asking"></p>
      </div>
      <div class="pilot-dialog-buttons">
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-wait-close" data-text="raw_options.ai.close"></button>
      </div>
    </div>
    <div class="pilot-rawopt-ai-stage" id="rawopt-ai-result" hidden>
      <div class="pilot-dialog-body">
        <p class="pilot-band pilot-band--error pilot-lines" id="rawopt-ai-failure" role="alert" hidden></p>
        <span id="rawopt-ai-duplicate" data-text="raw_options.ai.duplicate" hidden></span>
        <div class="pilot-rawopt-ai-found" id="rawopt-ai-found" hidden>
          <span class="pilot-rawopt-label" data-text="raw_options.ai.result.pattern"></span>
          <code class="pilot-mono pilot-lines" id="rawopt-ai-pattern"></code>
          <span class="pilot-rawopt-label" id="rawopt-ai-replacement-label" data-text="raw_options.ai.result.replacement"></span>
          <code class="pilot-mono pilot-lines" id="rawopt-ai-replacement"></code>
          <span class="pilot-rawopt-label" id="rawopt-ai-note-label" data-text="raw_options.ai.result.note"></span>
          <span class="pilot-lines" id="rawopt-ai-result-note"></span>
          <p id="rawopt-ai-count" role="status"></p>
          <div class="pilot-table-wrap">
            <table class="pilot-table" id="rawopt-ai-table">
              <thead>
                <tr>
                  <th scope="col" data-text="raw_options.ai.result.before"></th>
                  <th scope="col" data-text="raw_options.ai.result.after"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="pilot-note" data-text="raw_options.ai.result.local"></p>
        </div>
      </div>
      <div class="pilot-dialog-buttons">
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-add" data-text="raw_options.ai.add" hidden></button>
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-skip" data-text="raw_options.ai.skip" hidden></button>
        <button type="button" class="pilot-button pilot-button--secondary" id="rawopt-ai-result-close" data-text="raw_options.ai.close" hidden></button>
      </div>
    </div>
  </dialog>
  <!-- ドロップの印の要素（REQ-205 / ADR-0147 決定2）。js/drop.js がドロップのファイルの一覧をここへ送り、Python はここの drop だけを受ける -->
  <div id="drop-anchor" hidden></div>
  <!-- 起動時の絵（ADR-0174 決定2）。アプリ 1 回の起動で、最初に読み込まれた窓だけ（view の splash が真のとき）。窓いっぱいに重ね、
       1.2 秒後に 0.3 秒で薄くして消す。クリックかキーで、すぐ消す（js/character.js） -->
  <div class="pilot-splash" id="splash" hidden><img src="character/splash.png" alt="" aria-hidden="true" class="pilot-character" id="character-splash" hidden></div>
</body>
</html>
